name: Smart FastDL Sync (rclone)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: fastdl-sync-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  smart-sync:
    runs-on: ubuntu-latest

    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USERNAME }}
      FTP_PASS: ${{ secrets.FTP_PASSWORD }}
      REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}

    steps:
      - name: Checkout Repository (sparse)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            cstrike
            _excludes
          sparse-checkout-cone-mode: false

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bzip2 rsync rclone

      - name: Build stock skiplist + repo exclude lists
        run: |
          set -euo pipefail

          mkdir -p _excludes _state _state/diff _state/filesfrom

          : > _excludes/stock_maps_bsp.txt
          cat <<'EOF' | sed -E 's/^[[:space:]]+//; /^[[:space:]]*$/d' >> _excludes/stock_maps_bsp.txt
            test_speakers.bsp
            test_hardware.bsp
            de_train.bsp
            de_tides.bsp
            de_prodigy.bsp
            de_port.bsp
            de_piranesi.bsp
            de_nuke.bsp
            de_inferno.bsp
            de_dust2.bsp
            de_dust.bsp
            de_chateau.bsp
            de_cbble.bsp
            de_aztec.bsp
            cs_office.bsp
            cs_militia.bsp
            cs_italy.bsp
            cs_havana.bsp
            cs_compound.bsp
            cs_assault.bsp
          EOF
          sort -u -o _excludes/stock_maps_bsp.txt _excludes/stock_maps_bsp.txt

          : > _excludes/exclude_maps.txt
          : > _excludes/exclude_materials.txt
          : > _excludes/exclude_models.txt
          : > _excludes/exclude_resource_overviews.txt
          : > _excludes/exclude_sound.txt

          cat _excludes/stock_maps_bsp.txt >> _excludes/exclude_maps.txt

          if [ -d cstrike ]; then
            find cstrike -type f -name "*.bz2" -print0 | while IFS= read -r -d '' f; do
              rel="${f#cstrike/}"
              case "$rel" in
                maps/*)
                  echo "${rel#maps/}" | sed 's/\.bz2$//' >> _excludes/exclude_maps.txt
                  ;;
                materials/*)
                  echo "${rel#materials/}" | sed 's/\.bz2$//' >> _excludes/exclude_materials.txt
                  ;;
                models/*)
                  echo "${rel#models/}" | sed 's/\.bz2$//' >> _excludes/exclude_models.txt
                  ;;
                sound/*)
                  echo "${rel#sound/}" | sed 's/\.bz2$//' >> _excludes/exclude_sound.txt
                  ;;
                resource/overviews/*)
                  echo "${rel#resource/overviews/}" | sed 's/\.bz2$//' >> _excludes/exclude_resource_overviews.txt
                  ;;
              esac
            done
          fi

          for f in _excludes/exclude_*.txt; do
            sort -u -o "$f" "$f"
            echo "$(basename "$f"): $(wc -l < "$f")"
          done

      - name: Configure rclone (plain FTP)
        run: |
          set -euo pipefail
          : "${FTP_HOST:?}"
          : "${FTP_USER:?}"
          : "${FTP_PASS:?}"
          : "${REMOTE_PATH:?}"

          cat > rclone.conf <<EOF
          [ftp]
          type = ftp
          host = ${FTP_HOST}
          user = ${FTP_USER}
          pass = $(rclone obscure "${FTP_PASS}")
          EOF

      - name: Precheck diff (build files-from lists, exit early if no changes)
        run: |
          set -euo pipefail

          mkdir -p _state/remote _state/repo _state/diff _state/filesfrom

          # Repo sets (bz2 minus suffix, keep subpaths)
          : > _state/repo/maps.txt
          : > _state/repo/materials.txt
          : > _state/repo/models.txt
          : > _state/repo/sound.txt
          : > _state/repo/resource_overviews.txt

          if [ -d cstrike ]; then
            find cstrike -type f -name "*.bz2" -print0 | while IFS= read -r -d '' f; do
              rel="${f#cstrike/}"
              case "$rel" in
                maps/*)               echo "${rel#maps/}"               | sed 's/\.bz2$//' >> _state/repo/maps.txt ;;
                materials/*)          echo "${rel#materials/}"          | sed 's/\.bz2$//' >> _state/repo/materials.txt ;;
                models/*)             echo "${rel#models/}"             | sed 's/\.bz2$//' >> _state/repo/models.txt ;;
                sound/*)              echo "${rel#sound/}"              | sed 's/\.bz2$//' >> _state/repo/sound.txt ;;
                resource/overviews/*) echo "${rel#resource/overviews/}" | sed 's/\.bz2$//' >> _state/repo/resource_overviews.txt ;;
              esac
            done
          fi

          for d in maps materials models sound resource_overviews; do
            sort -u -o "_state/repo/${d}.txt" "_state/repo/${d}.txt"
          done

          # Remote sets
          rclone lsf "ftp:${REMOTE_PATH}/maps" --config rclone.conf --recursive --files-only --format p \
            | grep -E '\.(bsp|nav)$' | sort -u > _state/remote/maps.txt
          rclone lsf "ftp:${REMOTE_PATH}/materials" --config rclone.conf --recursive --files-only --format p \
            | grep -E '\.(vmt|vtf)$' | sort -u > _state/remote/materials.txt
          rclone lsf "ftp:${REMOTE_PATH}/models" --config rclone.conf --recursive --files-only --format p \
            | grep -E '\.(mdl|vvd|vtx)$' | sort -u > _state/remote/models.txt
          rclone lsf "ftp:${REMOTE_PATH}/sound" --config rclone.conf --recursive --files-only --format p \
            | grep -E '\.(wav|mp3)$' | sort -u > _state/remote/sound.txt
          rclone lsf "ftp:${REMOTE_PATH}/resource/overviews" --config rclone.conf --recursive --files-only --format p \
            | grep -E '\.txt$' | sort -u > _state/remote/resource_overviews.txt

          # Diffs
          total_missing=0
          total_stale=0

          diff_dir() {
            local d="$1"
            comm -13 "_state/repo/${d}.txt" "_state/remote/${d}.txt" > "_state/diff/${d}.missing.txt" || true
            comm -23 "_state/repo/${d}.txt" "_state/remote/${d}.txt" > "_state/diff/${d}.stale.txt" || true
            local m s
            m=$(wc -l < "_state/diff/${d}.missing.txt")
            s=$(wc -l < "_state/diff/${d}.stale.txt")
            echo "$d missing: $m"
            echo "$d stale:   $s"
            total_missing=$((total_missing + m))
            total_stale=$((total_stale + s))
          }

          diff_dir maps
          diff_dir materials
          diff_dir models
          diff_dir sound
          diff_dir resource_overviews

          echo "TOTAL missing: $total_missing"
          echo "TOTAL stale:   $total_stale"

          # Build files-from lists (paths relative to each remote root)
          cp _state/diff/maps.missing.txt _state/filesfrom/maps.txt
          cp _state/diff/materials.missing.txt _state/filesfrom/materials.txt
          cp _state/diff/models.missing.txt _state/filesfrom/models.txt
          cp _state/diff/sound.missing.txt _state/filesfrom/sound.txt
          cp _state/diff/resource_overviews.missing.txt _state/filesfrom/resource_overviews.txt

          if [ "$total_missing" -eq 0 ] && [ "$total_stale" -eq 0 ]; then
            echo "No changes between FTP and repo. Exiting early."
            exit 0
          fi

      - name: Sync missing only from FTP -> _ftp (files-from)
        run: |
          set -euo pipefail

          rm -rf _ftp _out
          mkdir -p _ftp/maps _ftp/materials _ftp/models _ftp/sound _ftp/resource/overviews

          common_flags="--config rclone.conf --transfers 2 --checkers 4 --contimeout 10s --timeout 30s --retries 2 --low-level-retries 2 --stats 10s"

          if [ -s _state/filesfrom/maps.txt ]; then
            rclone copy "ftp:${REMOTE_PATH}/maps" _ftp/maps --files-from _state/filesfrom/maps.txt $common_flags
          fi

          if [ -s _state/filesfrom/materials.txt ]; then
            rclone copy "ftp:${REMOTE_PATH}/materials" _ftp/materials --files-from _state/filesfrom/materials.txt $common_flags
          fi

          if [ -s _state/filesfrom/models.txt ]; then
            rclone copy "ftp:${REMOTE_PATH}/models" _ftp/models --files-from _state/filesfrom/models.txt $common_flags
          fi

          if [ -s _state/filesfrom/sound.txt ]; then
            rclone copy "ftp:${REMOTE_PATH}/sound" _ftp/sound --files-from _state/filesfrom/sound.txt $common_flags
          fi

          if [ -s _state/filesfrom/resource_overviews.txt ]; then
            rclone copy "ftp:${REMOTE_PATH}/resource/overviews" _ftp/resource/overviews --files-from _state/filesfrom/resource_overviews.txt $common_flags
          fi

      - name: Compress to bz2-only and merge into repo
        run: |
          set -euo pipefail

          mkdir -p _out
          rsync -a _ftp/ _out/

          find _out -type f \( \
            -name "*.bsp" -o -name "*.nav" -o \
            -name "*.vmt" -o -name "*.vtf" -o \
            -name "*.mdl" -o -name "*.vvd" -o -name "*.vtx" -o \
            -name "*.wav" -o -name "*.mp3" -o \
            -path "*/resource/overviews/*.txt" \
          \) -print0 | while IFS= read -r -d '' f; do
            bzip2 -f -k "$f"
            rm -f "$f"
          done

          mkdir -p cstrike
          rsync -a _out/ cstrike/

          find cstrike -type f \( \
            -name "*.bsp" -o -name "*.nav" -o \
            -name "*.vmt" -o -name "*.vtf" -o \
            -name "*.mdl" -o -name "*.vvd" -o -name "*.vtx" -o \
            -name "*.wav" -o -name "*.mp3" -o \
            -path "*/resource/overviews/*.txt" \
          \) -delete || true

      - name: Prune stale files in repo (repo - FTP)
        run: |
          set -euo pipefail

          delete_stale() {
            local d="$1"
            local prefix="cstrike/${d}"
            local stale="_state/diff/${d}.stale.txt"
            if [ -s "$stale" ]; then
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                echo "DEL ${prefix}/${f}.bz2"
                rm -f "${prefix}/${f}.bz2"
              done < "$stale"
            fi
          }

          delete_stale maps
          delete_stale materials
          delete_stale models
          delete_stale sound
          delete_stale resource_overviews

          # Always prune stock/test maps (bsp only)
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            rm -f "cstrike/maps/${f}.bz2"
          done < _excludes/stock_maps_bsp.txt

      - name: Commit and push (rebase-safe)
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cstrike _excludes || true

          if git diff --cached --quiet; then
            echo "No staged changes."
            exit 0
          fi

          git commit -m "FastDL: Sync (rclone ftp, files-from, add + prune, overviews-only, bz2-only)"

          for i in 1 2; do
            git fetch origin main
            git rebase origin/main || (git rebase --abort && exit 1)
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (non-fast-forward). Retrying ($i/2)..."
            sleep 2
          done

          echo "Push failed after retries."
          exit 1
