name: Smart FastDL Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  smart-sync:
    runs-on: ubuntu-latest

    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USERNAME }}
      FTP_PASS: ${{ secrets.FTP_PASSWORD }}
      REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            cstrike
            _excludes
          sparse-checkout-cone-mode: false

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lftp bzip2 rsync

      - name: Build exclude lists from repo + stock map skiplist
        run: |
          set -euo pipefail

          mkdir -p _excludes

          : > _excludes/stock_maps_bsp.txt
          cat >> _excludes/stock_maps_bsp.txt <<'EOF'
          test_speakers.bsp
          test_hardware.bsp
          de_train.bsp
          de_tides.bsp
          de_prodigy.bsp
          de_port.bsp
          de_piranesi.bsp
          de_nuke.bsp
          de_inferno.bsp
          de_dust2.bsp
          de_dust.bsp
          de_chateau.bsp
          de_cbble.bsp
          de_aztec.bsp
          cs_office.bsp
          cs_militia.bsp
          cs_italy.bsp
          cs_havana.bsp
          cs_compound.bsp
          cs_assault.bsp
          EOF
          sort -u -o _excludes/stock_maps_bsp.txt _excludes/stock_maps_bsp.txt

          : > _excludes/exclude_maps.txt
          : > _excludes/exclude_materials.txt
          : > _excludes/exclude_models.txt
          : > _excludes/exclude_sound.txt
          : > _excludes/exclude_resource_overviews.txt

          cat _excludes/stock_maps_bsp.txt >> _excludes/exclude_maps.txt

          if [ -d cstrike ]; then
            find cstrike -type f -name "*.bz2" -print0 | while IFS= read -r -d '' f; do
              rel="${f#cstrike/}"
              case "$rel" in
                maps/*)
                  echo "${rel#maps/}" | sed 's/\.bz2$//' >> _excludes/exclude_maps.txt
                  ;;
                materials/*)
                  echo "${rel#materials/}" | sed 's/\.bz2$//' >> _excludes/exclude_materials.txt
                  ;;
                models/*)
                  echo "${rel#models/}" | sed 's/\.bz2$//' >> _excludes/exclude_models.txt
                  ;;
                sound/*)
                  echo "${rel#sound/}" | sed 's/\.bz2$//' >> _excludes/exclude_sound.txt
                  ;;
                resource/overviews/*)
                  echo "${rel#resource/overviews/}" | sed 's/\.bz2$//' >> _excludes/exclude_resource_overviews.txt
                  ;;
              esac
            done
          fi

          for f in _excludes/exclude_*.txt; do
            sort -u -o "$f" "$f"
            echo "$(basename "$f"): $(wc -l < "$f")"
          done

      - name: Mirror missing content from FTP (recursive-safe)
        run: |
          set -euo pipefail
          : "${FTP_HOST:?}"
          : "${FTP_USER:?}"
          : "${FTP_PASS:?}"
          : "${REMOTE_PATH:?}"

          rm -rf _ftp _out
          mkdir -p _ftp/maps _ftp/materials _ftp/models _ftp/sound _ftp/resource/overviews

          lftp -c "
            set cmd:fail-exit yes;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;

            open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST';
            cd '$REMOTE_PATH';

            mirror --continue --only-newer --parallel=3 --verbose=1 \
              --exclude-glob \"*\" \
              --include-glob \"*/\" \
              --include-glob \"*.bsp\" --include-glob \"*.nav\" \
              --exclude-glob-from=_excludes/exclude_maps.txt \
              maps _ftp/maps;

            mirror --continue --only-newer --parallel=3 --verbose=1 \
              --exclude-glob \"*\" \
              --include-glob \"*/\" \
              --include-glob \"*.vmt\" --include-glob \"*.vtf\" \
              --exclude-glob-from=_excludes/exclude_materials.txt \
              materials _ftp/materials;

            mirror --continue --only-newer --parallel=3 --verbose=1 \
              --exclude-glob \"*\" \
              --include-glob \"*/\" \
              --include-glob \"*.mdl\" --include-glob \"*.vvd\" --include-glob \"*.vtx\" \
              --exclude-glob-from=_excludes/exclude_models.txt \
              models _ftp/models;

            mirror --continue --only-newer --parallel=3 --verbose=1 \
              --exclude-glob \"*\" \
              --include-glob \"*/\" \
              --include-glob \"*.wav\" --include-glob \"*.mp3\" \
              --exclude-glob-from=_excludes/exclude_sound.txt \
              sound _ftp/sound;

            mirror --continue --only-newer --parallel=3 --verbose=1 \
              --exclude-glob \"*\" \
              --include-glob \"*/\" \
              --include-glob \"*.txt\" \
              --exclude-glob-from=_excludes/exclude_resource_overviews.txt \
              resource/overviews _ftp/resource/overviews;

            quit
          "

      - name: Compress to bz2-only and merge into repo
        run: |
          set -euo pipefail

          mkdir -p _out
          rsync -a _ftp/ _out/

          find _out -type f \( \
            -name "*.bsp" -o -name "*.nav" -o \
            -name "*.vmt" -o -name "*.vtf" -o \
            -name "*.mdl" -o -name "*.vvd" -o -name "*.vtx" -o \
            -name "*.wav" -o -name "*.mp3" -o \
            -path "*/resource/overviews/*.txt" \
          \) -print0 | while IFS= read -r -d '' f; do
            bzip2 -f -k "$f"
            rm -f "$f"
          done

          mkdir -p cstrike
          rsync -a _out/ cstrike/

          find cstrike -type f \( \
            -name "*.bsp" -o -name "*.nav" -o \
            -name "*.vmt" -o -name "*.vtf" -o \
            -name "*.mdl" -o -name "*.vvd" -o -name "*.vtx" -o \
            -name "*.wav" -o -name "*.mp3" -o \
            -path "*/resource/overviews/*.txt" \
          \) -delete || true

      - name: Prune repo files not present on FTP (and always prune stock maps)
        run: |
          set -euo pipefail
          : "${FTP_HOST:?}"
          : "${FTP_USER:?}"
          : "${FTP_PASS:?}"
          : "${REMOTE_PATH:?}"

          mkdir -p _state/ftp _state/repo

          # Repo inventory (bz2 minus suffix, keep subpaths)
          : > _state/repo/maps.txt
          : > _state/repo/materials.txt
          : > _state/repo/models.txt
          : > _state/repo/sound.txt
          : > _state/repo/resource_overviews.txt

          if [ -d cstrike ]; then
            find cstrike -type f -name "*.bz2" -print0 | while IFS= read -r -d '' f; do
              rel="${f#cstrike/}"
              case "$rel" in
                maps/*)
                  echo "${rel#maps/}" | sed 's/\.bz2$//' >> _state/repo/maps.txt
                  ;;
                materials/*)
                  echo "${rel#materials/}" | sed 's/\.bz2$//' >> _state/repo/materials.txt
                  ;;
                models/*)
                  echo "${rel#models/}" | sed 's/\.bz2$//' >> _state/repo/models.txt
                  ;;
                sound/*)
                  echo "${rel#sound/}" | sed 's/\.bz2$//' >> _state/repo/sound.txt
                  ;;
                resource/overviews/*)
                  echo "${rel#resource/overviews/}" | sed 's/\.bz2$//' >> _state/repo/resource_overviews.txt
                  ;;
              esac
            done
          fi

          for d in maps materials models sound resource_overviews; do
            sort -u -o "_state/repo/${d}.txt" "_state/repo/${d}.txt"
          done

          # FTP inventory via lftp find (no wildcards, no 550)
          lftp -c "
            set cmd:fail-exit yes;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;

            open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST';
            cd '$REMOTE_PATH';

            find maps -type f;
            find materials -type f;
            find models -type f;
            find sound -type f;
            find resource/overviews -type f;

            quit
          " > _state/ftp/all.txt

          # Normalize FTP lists
          grep -E '^maps/.*\.(bsp|nav)$' _state/ftp/all.txt \
            | sed 's#^maps/##' \
            | grep -v -F -f _excludes/stock_maps_bsp.txt \
            | sort -u > _state/ftp/maps.txt

          grep -E '^materials/.*\.(vmt|vtf)$' _state/ftp/all.txt \
            | sed 's#^materials/##' \
            | sort -u > _state/ftp/materials.txt

          grep -E '^models/.*\.(mdl|vvd|vtx)$' _state/ftp/all.txt \
            | sed 's#^models/##' \
            | sort -u > _state/ftp/models.txt

          grep -E '^sound/.*\.(wav|mp3)$' _state/ftp/all.txt \
            | sed 's#^sound/##' \
            | sort -u > _state/ftp/sound.txt

          grep -E '^resource/overviews/.*\.txt$' _state/ftp/all.txt \
            | sed 's#^resource/overviews/##' \
            | sort -u > _state/ftp/resource_overviews.txt

          # Delete stale: repo - ftp
          delete_stale() {
            local d="$1"
            local repo_list="_state/repo/${d}.txt"
            local ftp_list="_state/ftp/${d}.txt"
            local prefix="cstrike/${d}"
            comm -23 "$repo_list" "$ftp_list" | while IFS= read -r f; do
              [ -z "$f" ] && continue
              rm -f "${prefix}/${f}.bz2"
            done
          }

          delete_stale maps
          delete_stale materials
          delete_stale models
          delete_stale sound
          delete_stale resource_overviews

          # Always prune stock maps (bsp only)
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            rm -f "cstrike/maps/${f}.bz2"
          done < _excludes/stock_maps_bsp.txt

      - name: Push Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "FastDL: Sync (add + prune, stock-skiplist, overviews-only)"
          branch: main
          file_pattern: "cstrike/** _excludes/** _state/**"
