name: Smart FastDL Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  smart-sync:
    runs-on: ubuntu-latest

    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USERNAME }}
      FTP_PASS: ${{ secrets.FTP_PASSWORD }}
      REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lftp bzip2 rsync

      - name: Build stock map skiplist (and derived nav/res)
        run: |
          set -euo pipefail
          mkdir -p _excludes _state

          : > _excludes/stock_maps_bsp.txt
          cat >> _excludes/stock_maps_bsp.txt <<'EOF'
          test_speakers.bsp
          test_hardware.bsp
          de_train.bsp
          de_tides.bsp
          de_prodigy.bsp
          de_port.bsp
          de_piranesi.bsp
          de_nuke.bsp
          de_inferno.bsp
          de_dust2.bsp
          de_dust.bsp
          de_chateau.bsp
          de_cbble.bsp
          de_aztec.bsp
          cs_office.bsp
          cs_militia.bsp
          cs_italy.bsp
          cs_havana.bsp
          cs_compound.bsp
          cs_assault.bsp
          EOF

          : > _excludes/stock_maps_all.txt
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "$f" >> _excludes/stock_maps_all.txt
            base="${f%.bsp}"
            echo "${base}.nav" >> _excludes/stock_maps_all.txt
            echo "${base}.res" >> _excludes/stock_maps_all.txt
          done < _excludes/stock_maps_bsp.txt
          sort -u -o _excludes/stock_maps_all.txt _excludes/stock_maps_all.txt

      - name: Fetch FTP inventory (what should exist)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}
        run: |
          set -euo pipefail
          : "${FTP_HOST:?}"
          : "${FTP_USER:?}"
          : "${FTP_PASS:?}"
          : "${REMOTE_PATH:?}"

          mkdir -p _state/ftp

          lftp -e "
            set cmd:fail-exit yes;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:max-retries 2;
            set net:timeout 10;

            open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST';
            cd '$REMOTE_PATH';

            cls -1 maps/*;

            cls -1 materials/*;
            cls -1 materials/**;

            cls -1 models/*;
            cls -1 models/**;

            cls -1 sound/*;
            cls -1 sound/**;

            cls -1 resource/overviews/*;

            quit
          " > _state/ftp/raw_listing.txt

          grep -E '^maps/.*\.(bsp|nav|res)$' _state/ftp/raw_listing.txt \
            | sed 's#^maps/##' \
            | grep -v -F -f _excludes/stock_maps_all.txt \
            | sort -u > _state/ftp/maps.txt

          grep -E '^materials/.*\.(vmt|vtf)$' _state/ftp/raw_listing.txt \
            | sed 's#^materials/##' \
            | sort -u > _state/ftp/materials.txt

          grep -E '^models/.*\.(mdl|vvd|vtx|phy)$' _state/ftp/raw_listing.txt \
            | sed 's#^models/##' \
            | sort -u > _state/ftp/models.txt

          grep -E '^sound/.*\.(wav|mp3)$' _state/ftp/raw_listing.txt \
            | sed 's#^sound/##' \
            | sort -u > _state/ftp/sound.txt

          grep -E '^resource/overviews/.*\.txt$' _state/ftp/raw_listing.txt \
            | sed 's#^resource/overviews/##' \
            | sort -u > _state/ftp/resource_overviews.txt

          echo "FTP inventory counts:"
          echo "maps: $(wc -l < _state/ftp/maps.txt)"
          echo "materials: $(wc -l < _state/ftp/materials.txt)"
          echo "models: $(wc -l < _state/ftp/models.txt)"
          echo "sound: $(wc -l < _state/ftp/sound.txt)"
          echo "resource_overviews: $(wc -l < _state/ftp/resource_overviews.txt)"

      - name: Build repo inventory (what we have)
        run: |
          set -euo pipefail
          mkdir -p _state/repo

          : > _state/repo/maps.txt
          : > _state/repo/materials.txt
          : > _state/repo/models.txt
          : > _state/repo/sound.txt
          : > _state/repo/resource_overviews.txt

          if [ -d cstrike ]; then
            find cstrike -type f -name "*.bz2" -print0 | while IFS= read -r -d '' f; do
              rel="${f#cstrike/}"
              case "$rel" in
                maps/*)
                  echo "${rel#maps/}" | sed 's/\.bz2$//' >> _state/repo/maps.txt
                  ;;
                materials/*)
                  echo "${rel#materials/}" | sed 's/\.bz2$//' >> _state/repo/materials.txt
                  ;;
                models/*)
                  echo "${rel#models/}" | sed 's/\.bz2$//' >> _state/repo/models.txt
                  ;;
                sound/*)
                  echo "${rel#sound/}" | sed 's/\.bz2$//' >> _state/repo/sound.txt
                  ;;
                resource/overviews/*)
                  echo "${rel#resource/overviews/}" | sed 's/\.bz2$//' >> _state/repo/resource_overviews.txt
                  ;;
              esac
            done
          fi

          for d in maps materials models sound resource_overviews; do
            sort -u -o "_state/repo/${d}.txt" "_state/repo/${d}.txt"
            echo "repo $d: $(wc -l < "_state/repo/${d}.txt")"
          done

      - name: Sanitize repo vs FTP (delete removed + delete stock that slipped in)
        run: |
          set -euo pipefail

          rm -f _state/to_delete_paths.txt
          touch _state/to_delete_paths.txt

          delete_diff() {
            local d="$1"
            local repo_list="_state/repo/${d}.txt"
            local ftp_list="_state/ftp/${d}.txt"
            local prefix="cstrike/${d}"

            # repo - ftp = stale to delete
            comm -23 "$repo_list" "$ftp_list" | while IFS= read -r f; do
              [ -z "$f" ] && continue
              echo "${prefix}/${f}.bz2" >> _state/to_delete_paths.txt
            done
          }

          delete_diff maps
          delete_diff materials
          delete_diff models
          delete_diff sound
          delete_diff resource_overviews

          # Extra safety: remove any stock maps (and nav/res) if they exist as bz2
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "cstrike/maps/${f}.bz2" >> _state/to_delete_paths.txt
          done < _excludes/stock_maps_all.txt

          sort -u -o _state/to_delete_paths.txt _state/to_delete_paths.txt

          del_count=$(wc -l < _state/to_delete_paths.txt)
          echo "Repo files to delete: $del_count"

          if [ "$del_count" -gt 0 ]; then
            while IFS= read -r p; do
              rm -f "$p"
            done < _state/to_delete_paths.txt
          fi

      - name: Build FTP download exclude lists (skip what repo already has + stock maps)
        run: |
          set -euo pipefail
          mkdir -p _excludes

          cp _state/repo/maps.txt _excludes/exclude_maps.txt
          cat _excludes/stock_maps_all.txt >> _excludes/exclude_maps.txt
          sort -u -o _excludes/exclude_maps.txt _excludes/exclude_maps.txt

          cp _state/repo/materials.txt _excludes/exclude_materials.txt
          cp _state/repo/models.txt _excludes/exclude_models.txt
          cp _state/repo/sound.txt _excludes/exclude_sound.txt
          cp _state/repo/resource_overviews.txt _excludes/exclude_resource_overviews.txt

          echo "Exclude counts:"
          echo "maps: $(wc -l < _excludes/exclude_maps.txt)"
          echo "materials: $(wc -l < _excludes/exclude_materials.txt)"
          echo "models: $(wc -l < _excludes/exclude_models.txt)"
          echo "sound: $(wc -l < _excludes/exclude_sound.txt)"
          echo "resource_overviews: $(wc -l < _excludes/exclude_resource_overviews.txt)"

      - name: Mirror missing content from FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}
        run: |
          set -euo pipefail

          rm -rf _ftp _out
          mkdir -p _ftp/maps _ftp/materials _ftp/models _ftp/sound _ftp/resource/overviews

          lftp -c "
            set cmd:fail-exit yes;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST';
            cd '$REMOTE_PATH';

            mirror --continue --only-newer --parallel=3 --verbose=1 \
              --include-glob \"*.bsp\" --include-glob \"*.nav\" --include-glob \"*.res\" \
              --exclude-glob-from=_excludes/exclude_maps.txt \
              --exclude-glob \"*\" \
              maps _ftp/maps;

            mirror --continue --only-newer --parallel=3 --verbose=1 \
              --include-glob \"*.vmt\" --include-glob \"*.vtf\" \
              --exclude-glob-from=_excludes/exclude_materials.txt \
              --exclude-glob \"*\" \
              materials _ftp/materials;

            mirror --continue --only-newer --parallel=3 --verbose=1 \
              --include-glob \"*.mdl\" --include-glob \"*.vvd\" --include-glob \"*.vtx\" --include-glob \"*.phy\" \
              --exclude-glob-from=_excludes/exclude_models.txt \
              --exclude-glob \"*\" \
              models _ftp/models;

            mirror --continue --only-newer --parallel=3 --verbose=1 \
              --include-glob \"*.wav\" --include-glob \"*.mp3\" \
              --exclude-glob-from=_excludes/exclude_sound.txt \
              --exclude-glob \"*\" \
              sound _ftp/sound;

            mirror --continue --only-newer --parallel=3 --verbose=1 \
              --include-glob \"*.txt\" \
              --exclude-glob-from=_excludes/exclude_resource_overviews.txt \
              --exclude-glob \"*\" \
              resource/overviews _ftp/resource/overviews;

            quit
          "

      - name: Compress to bz2-only and merge into repo
        run: |
          set -euo pipefail

          mkdir -p _out
          rsync -a _ftp/ _out/

          find _out -type f \( \
            -name "*.bsp" -o -name "*.nav" -o -name "*.res" -o \
            -name "*.vmt" -o -name "*.vtf" -o \
            -name "*.mdl" -o -name "*.vvd" -o -name "*.vtx" -o -name "*.phy" -o \
            -name "*.wav" -o -name "*.mp3" -o \
            -path "*/resource/overviews/*.txt" \
          \) -print0 | while IFS= read -r -d '' f; do
            bzip2 -f -k "$f"
            rm -f "$f"
          done

          mkdir -p cstrike
          rsync -a _out/ cstrike/

          # enforce bz2-only
          find cstrike -type f \( \
            -name "*.bsp" -o -name "*.nav" -o -name "*.res" -o \
            -name "*.vmt" -o -name "*.vtf" -o \
            -name "*.mdl" -o -name "*.vvd" -o -name "*.vtx" -o -name "*.phy" -o \
            -name "*.wav" -o -name "*.mp3" -o \
            -path "*/resource/overviews/*.txt" \
          \) -delete || true

      - name: Push Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "FastDL: Sync (FTP inventory reconcile + stock skiplist + overviews-only)"
          branch: main
          file_pattern: "cstrike/** _excludes/** _state/**"
