name: Smart FastDL Sync

on:
  workflow_dispatch:
    inputs:
      sanitize_stock:
        description: "Set to 1 for one-time removal of stock maps already in repo"
        required: false
        default: "0"
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  smart-sync:
    runs-on: ubuntu-latest

    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USERNAME }}
      FTP_PASS: ${{ secrets.FTP_PASSWORD }}
      REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}
      SANITIZE_STOCK: ${{ github.event.inputs.sanitize_stock || '0' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lftp bzip2 rsync

      - name: Restore raw cache
        uses: actions/cache@v4
        with:
          path: _raw_cache
          key: fastdl-raw-${{ github.repository }}-${{ runner.os }}
          restore-keys: |
            fastdl-raw-${{ github.repository }}-${{ runner.os }}

      - name: Build exclude lists (defaults + repo bz2 + stock map list)
        run: |
          set -euo pipefail
          : "${FTP_HOST:?}"
          : "${FTP_USER:?}"
          : "${FTP_PASS:?}"
          : "${REMOTE_PATH:?}"

          mkdir -p _excludes
          for d in maps materials models sound resource_overviews; do
            : > "_excludes/final_${d}.txt"
          done

          echo "::group::Detect reinstall batch signature from maps/test_speakers.bsp"
          RAW_REF=$(
            lftp -u "$FTP_USER,$FTP_PASS" \
              -e "set ssl:verify-certificate no; cd '$REMOTE_PATH'; cls -l maps/test_speakers.bsp; quit" \
              "$FTP_HOST" || true
          )
          REF_SIG=$(echo "$RAW_REF" | grep -oE '[A-Za-z]{3}[[:space:]]+[0-9]{1,2}[[:space:]]+[0-9]{4}' | head -n 1 || true)
          if [ -n "$REF_SIG" ]; then
            echo "Reinstall batch signature: $REF_SIG"
          else
            echo "No date-only signature detected (skipping batch exclude)."
          fi
          echo "::endgroup::"

          echo "::group::Defaults exclude (date-only batch, maps only)"
          if [ -n "$REF_SIG" ]; then
            lftp -u "$FTP_USER,$FTP_PASS" \
              -e "set ssl:verify-certificate no; cd '$REMOTE_PATH'; cls -l maps; quit" \
              "$FTP_HOST" \
              | awk -v ref="$REF_SIG" '$0 ~ ref && $0 !~ /[0-9]{1,2}:[0-9]{2}/ { print $NF }' \
              | sort -u >> "_excludes/final_maps.txt"
          fi
          echo "test_speakers.bsp" >> "_excludes/final_maps.txt"
          echo "test_hardware.bsp" >> "_excludes/final_maps.txt"
          echo "::endgroup::"

          echo "::group::Hard exclude known CS:S stock maps (always)"
          cat >> "_excludes/final_maps.txt" <<'EOF'
          de_train.bsp
          de_tides.bsp
          de_prodigy.bsp
          de_port.bsp
          de_piranesi.bsp
          de_nuke.bsp
          de_inferno.bsp
          de_dust2.bsp
          de_dust.bsp
          de_chateau.bsp
          de_cbble.bsp
          de_aztec.bsp
          cs_office.bsp
          cs_militia.bsp
          cs_italy.bsp
          cs_havana.bsp
          cs_compound.bsp
          cs_assault.bsp
          EOF
          echo "::endgroup::"

          echo "::group::Exclude anything already present as bz2 in repo"
          if [ -d cstrike ]; then
            find cstrike -type f -name "*.bz2" -print0 | while IFS= read -r -d '' f; do
              rel="${f#cstrike/}"
              case "$rel" in
                maps/*)
                  echo "${rel#maps/}" | sed 's/\.bz2$//' >> "_excludes/final_maps.txt"
                  ;;
                materials/*)
                  echo "${rel#materials/}" | sed 's/\.bz2$//' >> "_excludes/final_materials.txt"
                  ;;
                models/*)
                  echo "${rel#models/}" | sed 's/\.bz2$//' >> "_excludes/final_models.txt"
                  ;;
                sound/*)
                  echo "${rel#sound/}" | sed 's/\.bz2$//' >> "_excludes/final_sound.txt"
                  ;;
                resource/overviews/*)
                  echo "${rel#resource/overviews/}" | sed 's/\.bz2$//' >> "_excludes/final_resource_overviews.txt"
                  ;;
              esac
            done
          fi
          echo "::endgroup::"

          for d in maps materials models sound resource_overviews; do
            sort -u -o "_excludes/final_${d}.txt" "_excludes/final_${d}.txt"
            echo "final_${d}: $(wc -l < "_excludes/final_${d}.txt")"
          done

      - name: Mirror into raw cache (incremental, low FTP load)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}
        run: |
          set -euo pipefail

          mkdir -p _raw_cache/{maps,materials,models,sound,resource/overviews}

          lftp -c "
            set cmd:fail-exit yes;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST';
            cd '$REMOTE_PATH';

            mirror --only-newer --continue --parallel=2 --verbose=0 \
              --exclude-glob \"*\" \
              --include-glob \"*.bsp\" --include-glob \"*.nav\" --include-glob \"*.res\" \
              --exclude-glob-from=_excludes/final_maps.txt \
              maps _raw_cache/maps;

            mirror --only-newer --continue --parallel=2 --verbose=0 \
              --exclude-glob \"*\" \
              --include-glob \"*.vmt\" --include-glob \"*.vtf\" \
              --exclude-glob-from=_excludes/final_materials.txt \
              materials _raw_cache/materials;

            mirror --only-newer --continue --parallel=2 --verbose=0 \
              --exclude-glob \"*\" \
              --include-glob \"*.mdl\" --include-glob \"*.vvd\" --include-glob \"*.vtx\" --include-glob \"*.phy\" \
              --exclude-glob-from=_excludes/final_models.txt \
              models _raw_cache/models;

            mirror --only-newer --continue --parallel=2 --verbose=0 \
              --exclude-glob \"*\" \
              --include-glob \"*.wav\" --include-glob \"*.mp3\" \
              --exclude-glob-from=_excludes/final_sound.txt \
              sound _raw_cache/sound;

            mirror --only-newer --continue --parallel=2 --verbose=0 \
              --exclude-glob \"*\" \
              --include-glob \"*.txt\" \
              --exclude-glob-from=_excludes/final_resource_overviews.txt \
              resource/overviews _raw_cache/resource/overviews;

            quit
          "

      - name: Compress changed raw files and merge into repo (bz2-only)
        run: |
          set -euo pipefail

          rm -rf _out
          mkdir -p _out
          rsync -a _raw_cache/ _out/

          find _out -type f \( \
            -name "*.bsp" -o -name "*.nav" -o -name "*.res" -o \
            -name "*.vmt" -o -name "*.vtf" -o \
            -name "*.mdl" -o -name "*.vvd" -o -name "*.vtx" -o -name "*.phy" -o \
            -name "*.wav" -o -name "*.mp3" -o \
            -path "*/resource/overviews/*.txt" \
          \) -print0 | while IFS= read -r -d '' f; do
            bzip2 -f -k "$f"
            rm -f "$f"
          done

          mkdir -p cstrike
          rsync -a _out/ cstrike/

          find cstrike -type f \( \
            -name "*.bsp" -o -name "*.nav" -o -name "*.res" -o \
            -name "*.vmt" -o -name "*.vtf" -o \
            -name "*.mdl" -o -name "*.vvd" -o -name "*.vtx" -o -name "*.phy" -o \
            -name "*.wav" -o -name "*.mp3" -o \
            -path "*/resource/overviews/*.txt" \
          \) -delete || true

      - name: One-time sanitize stock maps already in repo
        if: env.SANITIZE_STOCK == '1'
        run: |
          set -euo pipefail

          if [ ! -d cstrike/maps ]; then
            exit 0
          fi

          while IFS= read -r f; do
            [ -z "$f" ] && continue

            # Only act on *.bsp entries from the list
            case "$f" in
              *.bsp) ;;
              *) continue ;;
            esac

            base="${f%.bsp}"

            rm -f "cstrike/maps/${f}.bz2"
            rm -f "cstrike/maps/${base}.nav.bz2"
            rm -f "cstrike/maps/${base}.res.bz2"
          done < _excludes/final_maps.txt

      - name: Push Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "FastDL: Sync custom content (cached raw mirror)"
          branch: main
          file_pattern: "cstrike/** _excludes/**"
