name: Smart FastDL Sync

on:
  workflow_dispatch:
    inputs:
      sanitize_stock:
        description: "Set to 1 for one-time removal of listed stock maps already in repo"
        required: false
        default: "0"
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  smart-sync:
    runs-on: ubuntu-latest

    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USERNAME }}
      FTP_PASS: ${{ secrets.FTP_PASSWORD }}
      REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}
      SANITIZE_STOCK: ${{ github.event.inputs.sanitize_stock || '0' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lftp bzip2 rsync

      - name: Build exclude lists from GitHub + stock map skiplist
        run: |
          set -euo pipefail
          : "${FTP_HOST:?}"
          : "${FTP_USER:?}"
          : "${FTP_PASS:?}"
          : "${REMOTE_PATH:?}"

          mkdir -p _excludes

          : > _excludes/exclude_maps.txt
          : > _excludes/exclude_materials.txt
          : > _excludes/exclude_models.txt
          : > _excludes/exclude_sound.txt
          : > _excludes/exclude_resource_overviews.txt

          echo "::group::Stock map skiplist"
          cat >> _excludes/exclude_maps.txt <<'EOF'
          test_speakers.bsp
          test_hardware.bsp
          de_train.bsp
          de_tides.bsp
          de_prodigy.bsp
          de_port.bsp
          de_piranesi.bsp
          de_nuke.bsp
          de_inferno.bsp
          de_dust2.bsp
          de_dust.bsp
          de_chateau.bsp
          de_cbble.bsp
          de_aztec.bsp
          cs_office.bsp
          cs_militia.bsp
          cs_italy.bsp
          cs_havana.bsp
          cs_compound.bsp
          cs_assault.bsp
          EOF
          echo "::endgroup::"

          echo "::group::Exclude everything already present in repo as .bz2"
          if [ -d cstrike ]; then
            find cstrike -type f -name "*.bz2" -print0 | while IFS= read -r -d '' f; do
              rel="${f#cstrike/}"

              case "$rel" in
                maps/*)
                  echo "${rel#maps/}" | sed 's/\.bz2$//' >> _excludes/exclude_maps.txt
                  ;;
                materials/*)
                  echo "${rel#materials/}" | sed 's/\.bz2$//' >> _excludes/exclude_materials.txt
                  ;;
                models/*)
                  echo "${rel#models/}" | sed 's/\.bz2$//' >> _excludes/exclude_models.txt
                  ;;
                sound/*)
                  echo "${rel#sound/}" | sed 's/\.bz2$//' >> _excludes/exclude_sound.txt
                  ;;
                resource/overviews/*)
                  echo "${rel#resource/overviews/}" | sed 's/\.bz2$//' >> _excludes/exclude_resource_overviews.txt
                  ;;
              esac
            done
          fi

          for f in _excludes/exclude_*.txt; do
            sort -u -o "$f" "$f"
            echo "$(basename "$f"): $(wc -l < "$f")"
          done
          echo "::endgroup::"

      - name: Mirror missing content from FTP (maps/materials/models/sound + resource/overviews)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}
        run: |
          set -euo pipefail

          rm -rf _ftp _out
          mkdir -p _ftp/maps _ftp/materials _ftp/models _ftp/sound _ftp/resource/overviews

          lftp -c "
            set cmd:fail-exit yes;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST';
            cd '$REMOTE_PATH';

            mirror --continue --only-newer --parallel=3 --verbose=1 \
              --exclude-glob \"*\" \
              --include-glob \"*.bsp\" --include-glob \"*.nav\" --include-glob \"*.res\" \
              --exclude-glob-from=_excludes/exclude_maps.txt \
              maps _ftp/maps;

            mirror --continue --only-newer --parallel=3 --verbose=1 \
              --exclude-glob \"*\" \
              --include-glob \"*.vmt\" --include-glob \"*.vtf\" \
              --exclude-glob-from=_excludes/exclude_materials.txt \
              materials _ftp/materials;

            mirror --continue --only-newer --parallel=3 --verbose=1 \
              --exclude-glob \"*\" \
              --include-glob \"*.mdl\" --include-glob \"*.vvd\" --include-glob \"*.vtx\" --include-glob \"*.phy\" \
              --exclude-glob-from=_excludes/exclude_models.txt \
              models _ftp/models;

            mirror --continue --only-newer --parallel=3 --verbose=1 \
              --exclude-glob \"*\" \
              --include-glob \"*.wav\" --include-glob \"*.mp3\" \
              --exclude-glob-from=_excludes/exclude_sound.txt \
              sound _ftp/sound;

            mirror --continue --only-newer --parallel=3 --verbose=1 \
              --exclude-glob \"*\" \
              --include-glob \"*.txt\" \
              --exclude-glob-from=_excludes/exclude_resource_overviews.txt \
              resource/overviews _ftp/resource/overviews;

            quit
          "

      - name: Compress to bz2-only and merge into repo
        run: |
          set -euo pipefail

          mkdir -p _out
          rsync -a _ftp/ _out/

          find _out -type f \( \
            -name "*.bsp" -o -name "*.nav" -o -name "*.res" -o \
            -name "*.vmt" -o -name "*.vtf" -o \
            -name "*.mdl" -o -name "*.vvd" -o -name "*.vtx" -o -name "*.phy" -o \
            -name "*.wav" -o -name "*.mp3" -o \
            -path "*/resource/overviews/*.txt" \
          \) -print0 | while IFS= read -r -d '' f; do
            bzip2 -f -k "$f"
            rm -f "$f"
          done

          mkdir -p cstrike
          rsync -a _out/ cstrike/

          # enforce bz2-only
          find cstrike -type f \( \
            -name "*.bsp" -o -name "*.nav" -o -name "*.res" -o \
            -name "*.vmt" -o -name "*.vtf" -o \
            -name "*.mdl" -o -name "*.vvd" -o -name "*.vtx" -o -name "*.phy" -o \
            -name "*.wav" -o -name "*.mp3" -o \
            -path "*/resource/overviews/*.txt" \
          \) -delete || true

      - name: One-time sanitize stock maps already in repo
        if: env.SANITIZE_STOCK == '1'
        run: |
          set -euo pipefail
          if [ ! -d cstrike/maps ]; then
            exit 0
          fi

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.bsp) ;;
              *) continue ;;
            esac

            base="${f%.bsp}"

            rm -f "cstrike/maps/${f}.bz2"
            rm -f "cstrike/maps/${base}.nav.bz2"
            rm -f "cstrike/maps/${base}.res.bz2"
          done < _excludes/exclude_maps.txt

      - name: Push Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "FastDL: Sync custom content (repo-excludes, stock-skiplist, overviews-only)"
          branch: main
          file_pattern: "cstrike/** _excludes/**"
