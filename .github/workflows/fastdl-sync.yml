name: Smart FastDL Sync (Turbo)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: fastdl-sync-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  smart-sync:
    runs-on: ubuntu-latest

    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USERNAME }}
      FTP_PASS: ${{ secrets.FTP_PASSWORD }}
      REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}

    steps:
      - name: Checkout Repository (sparse)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            cstrike
            _excludes
          sparse-checkout-cone-mode: false

      - name: Setup Tools (Fast)
        run: |
          set -euo pipefail
          if ! command -v rclone >/dev/null 2>&1; then
            curl -fsSL https://rclone.org/install.sh | sudo bash
          fi

      - name: Configure rclone
        run: |
          set -euo pipefail
          : "${FTP_HOST:?}" "${FTP_USER:?}" "${FTP_PASS:?}" "${REMOTE_PATH:?}"

          cat > rclone.conf <<EOF
          [ftp]
          type = ftp
          host = ${FTP_HOST}
          user = ${FTP_USER}
          pass = $(rclone obscure "${FTP_PASS}")
          explicit_tls = false
          EOF

      - name: Scan & Diff (Single Pass)
        run: |
          set -euo pipefail
          mkdir -p _excludes _state/{repo,remote,diff,filesfrom}

          cat <<'EOF' | sed -E 's/^[[:space:]]+//; /^[[:space:]]*$/d' | sort -u > _excludes/stock_maps_bsp.txt
            test_speakers.bsp
            test_hardware.bsp
            de_train.bsp
            de_tides.bsp
            de_prodigy.bsp
            de_port.bsp
            de_piranesi.bsp
            de_nuke.bsp
            de_inferno.bsp
            de_dust2.bsp
            de_dust.bsp
            de_chateau.bsp
            de_cbble.bsp
            de_aztec.bsp
            cs_office.bsp
            cs_militia.bsp
            cs_italy.bsp
            cs_havana.bsp
            cs_compound.bsp
            cs_assault.bsp
          EOF

          echo "::group::Scan local repo"
          if [ -d cstrike ]; then
            find cstrike -type f -name "*.bz2" \
              | sed 's|^cstrike/||; s/\.bz2$//' \
              | sort > _state/repo/all.txt
          else
            : > _state/repo/all.txt
          fi
          echo "Repo files: $(wc -l < _state/repo/all.txt)"
          echo "::endgroup::"

          echo "::group::Scan remote FTP"
          rclone lsf "ftp:${REMOTE_PATH}" --config rclone.conf -R --files-only --format p \
            | sort > _state/remote/all.txt
          echo "Remote files (raw): $(wc -l < _state/remote/all.txt)"
          echo "::endgroup::"

          echo "::group::Compute Diff"
          : > _state/remote/filtered.txt
          grep -E '^maps/.*\.(bsp|nav)$|^materials/.*\.(vmt|vtf)$|^models/.*\.(mdl|vvd|vtx)$|^sound/.*\.(wav|mp3)$|^resource/overviews/.*\.txt$' \
            _state/remote/all.txt > _state/remote/filtered.txt || true
          sort -u -o _state/remote/filtered.txt _state/remote/filtered.txt

          comm -13 _state/repo/all.txt _state/remote/filtered.txt > _state/diff/missing.raw.txt || true
          comm -23 _state/repo/all.txt _state/remote/filtered.txt > _state/diff/stale.txt || true

          awk -v stock="_excludes/stock_maps_bsp.txt" '
            BEGIN {
              while ((getline s < stock) > 0) {
                if (s != "") skip["maps/" s]=1
              }
            }
            { if (!skip[$0]) print }
          ' _state/diff/missing.raw.txt > _state/filesfrom/missing.txt

          COUNT_MISSING=$(wc -l < _state/filesfrom/missing.txt || echo 0)
          COUNT_STALE=$(wc -l < _state/diff/stale.txt || echo 0)

          echo "TOTAL missing: $COUNT_MISSING"
          echo "TOTAL stale:   $COUNT_STALE"

          echo "COUNT_MISSING=$COUNT_MISSING" >> $GITHUB_ENV
          echo "COUNT_STALE=$COUNT_STALE" >> $GITHUB_ENV
          echo "::endgroup::"

      - name: Prune Stale (Cleanup)
        if: env.COUNT_STALE != '0'
        run: |
          set -euo pipefail
          echo "::group::Pruning Stale Files"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            rm -f "cstrike/${f}.bz2"
          done < _state/diff/stale.txt

          while IFS= read -r m; do
            [ -z "$m" ] && continue
            rm -f "cstrike/maps/${m}.bz2"
          done < _excludes/stock_maps_bsp.txt
          echo "::endgroup::"

      - name: Download Missing (Single Batch)
        if: env.COUNT_MISSING != '0'
        run: |
          set -euo pipefail
          echo "::group::Downloading Missing Files"
          mkdir -p _ftp

          rclone copy "ftp:${REMOTE_PATH}" _ftp \
            --config rclone.conf \
            --files-from _state/filesfrom/missing.txt \
            --transfers 4 --checkers 8 \
            --contimeout 10s --timeout 30s --retries 2 --low-level-retries 2 \
            --stats 5s
          echo "::endgroup::"

      - name: Compress & Merge (Parallel)
        if: env.COUNT_MISSING != '0'
        run: |
          set -euo pipefail
          echo "::group::Parallel Compression"
          mkdir -p _out
          rsync -a _ftp/ _out/

          find _out -type f \( \
            -path "*/maps/*.bsp" -o -path "*/maps/*.nav" -o \
            -name "*.vmt" -o -name "*.vtf" -o \
            -name "*.mdl" -o -name "*.vvd" -o -name "*.vtx" -o \
            -name "*.wav" -o -name "*.mp3" -o \
            -path "*/resource/overviews/*.txt" \
          \) -print0 | xargs -0 -P "$(nproc)" -I {} bzip2 -z -f "{}"

          echo "::endgroup::"

          echo "::group::Merge to Repo"
          mkdir -p cstrike
          rsync -a _out/ cstrike/

          # Remove any raw files but protect common repo artifacts
          find cstrike -type f ! -name "*.bz2" ! -name ".gitattributes" ! -name ".nojekyll" -delete || true
          echo "::endgroup::"

      - name: Commit and Push
        if: env.COUNT_MISSING != '0' || env.COUNT_STALE != '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cstrike _excludes || true
          git diff --cached --quiet && echo "No changes." && exit 0

          git commit -m "FastDL: Turbo sync (single-pass)"

          for i in 1 2; do
            git fetch origin main
            git rebase origin/main || (git rebase --abort && exit 1)
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
