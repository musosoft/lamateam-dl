name: Smart FastDL Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  smart-sync:
    runs-on: ubuntu-latest

    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USERNAME }}
      FTP_PASS: ${{ secrets.FTP_PASSWORD }}
      REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            cstrike
            _excludes
          sparse-checkout-cone-mode: false

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bzip2 rsync rclone

      - name: Build stock skiplist + repo exclude lists
        run: |
          set -euo pipefail

          mkdir -p _excludes _state

          : > _excludes/stock_maps_bsp.txt
          cat <<'EOF' | sed -E 's/^[[:space:]]+//; /^[[:space:]]*$/d' >> _excludes/stock_maps_bsp.txt
            test_speakers.bsp
            test_hardware.bsp
            de_train.bsp
            de_tides.bsp
            de_prodigy.bsp
            de_port.bsp
            de_piranesi.bsp
            de_nuke.bsp
            de_inferno.bsp
            de_dust2.bsp
            de_dust.bsp
            de_chateau.bsp
            de_cbble.bsp
            de_aztec.bsp
            cs_office.bsp
            cs_militia.bsp
            cs_italy.bsp
            cs_havana.bsp
            cs_compound.bsp
            cs_assault.bsp
          EOF
          sort -u -o _excludes/stock_maps_bsp.txt _excludes/stock_maps_bsp.txt

          : > _excludes/exclude_maps.txt
          : > _excludes/exclude_materials.txt
          : > _excludes/exclude_models.txt
          : > _excludes/exclude_sound.txt
          : > _excludes/exclude_resource_overviews.txt

          cat _excludes/stock_maps_bsp.txt >> _excludes/exclude_maps.txt

          if [ -d cstrike ]; then
            find cstrike -type f -name "*.bz2" -print0 | while IFS= read -r -d '' f; do
              rel="${f#cstrike/}"
              case "$rel" in
                maps/*)
                  echo "${rel#maps/}" | sed 's/\.bz2$//' >> _excludes/exclude_maps.txt
                  ;;
                materials/*)
                  echo "${rel#materials/}" | sed 's/\.bz2$//' >> _excludes/exclude_materials.txt
                  ;;
                models/*)
                  echo "${rel#models/}" | sed 's/\.bz2$//' >> _excludes/exclude_models.txt
                  ;;
                sound/*)
                  echo "${rel#sound/}" | sed 's/\.bz2$//' >> _excludes/exclude_sound.txt
                  ;;
                resource/overviews/*)
                  echo "${rel#resource/overviews/}" | sed 's/\.bz2$//' >> _excludes/exclude_resource_overviews.txt
                  ;;
              esac
            done
          fi

          for f in _excludes/exclude_*.txt; do
            sort -u -o "$f" "$f"
            echo "$(basename "$f"): $(wc -l < "$f")"
          done

      - name: Configure rclone (plain FTP)
        run: |
          set -euo pipefail
          : "${FTP_HOST:?}"
          : "${FTP_USER:?}"
          : "${FTP_PASS:?}"
          : "${REMOTE_PATH:?}"

          cat > rclone.conf <<EOF
          [ftp]
          type = ftp
          host = ${FTP_HOST}
          user = ${FTP_USER}
          pass = $(rclone obscure "${FTP_PASS}")
          EOF

      - name: Sync missing from FTP -> _ftp (filtered)
        run: |
          set -euo pipefail
          rm -rf _ftp _out
          mkdir -p _ftp/maps _ftp/materials _ftp/models _ftp/sound _ftp/resource/overviews

          # NOTE:
          # - We do NOT sync maps/*.res (never downloaded)
          # - models: no .phy
          # - resource: only overviews/*.txt
          # - We use repo excludes to avoid re-downloading, and stock map excludes to avoid bloat.
          #
          # rclone filter rules are applied top-down. Use: include allowed, exclude everything else.

          build_filter_file_maps() {
            : > _state/filter_maps.txt
            echo "+ */" >> _state/filter_maps.txt
            echo "+ *.bsp" >> _state/filter_maps.txt
            echo "+ *.nav" >> _state/filter_maps.txt
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              echo "- $f" >> _state/filter_maps.txt
            done < _excludes/exclude_maps.txt
            echo "- *" >> _state/filter_maps.txt
          }

          build_filter_file_materials() {
            : > _state/filter_materials.txt
            echo "+ */" >> _state/filter_materials.txt
            echo "+ *.vmt" >> _state/filter_materials.txt
            echo "+ *.vtf" >> _state/filter_materials.txt
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              echo "- $f" >> _state/filter_materials.txt
            done < _excludes/exclude_materials.txt
            echo "- *" >> _state/filter_materials.txt
          }

          build_filter_file_models() {
            : > _state/filter_models.txt
            echo "+ */" >> _state/filter_models.txt
            echo "+ *.mdl" >> _state/filter_models.txt
            echo "+ *.vvd" >> _state/filter_models.txt
            echo "+ *.vtx" >> _state/filter_models.txt
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              echo "- $f" >> _state/filter_models.txt
            done < _excludes/exclude_models.txt
            echo "- *" >> _state/filter_models.txt
          }

          build_filter_file_sound() {
            : > _state/filter_sound.txt
            echo "+ */" >> _state/filter_sound.txt
            echo "+ *.wav" >> _state/filter_sound.txt
            echo "+ *.mp3" >> _state/filter_sound.txt
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              echo "- $f" >> _state/filter_sound.txt
            done < _excludes/exclude_sound.txt
            echo "- *" >> _state/filter_sound.txt
          }

          build_filter_file_overviews() {
            : > _state/filter_overviews.txt
            echo "+ */" >> _state/filter_overviews.txt
            echo "+ *.txt" >> _state/filter_overviews.txt
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              echo "- $f" >> _state/filter_overviews.txt
            done < _excludes/exclude_resource_overviews.txt
            echo "- *" >> _state/filter_overviews.txt
          }

          build_filter_file_maps
          build_filter_file_materials
          build_filter_file_models
          build_filter_file_sound
          build_filter_file_overviews

          # Use --ignore-existing to avoid pulling files we already have; rely on prune step to delete.
          # Use conservative transfers to avoid stressing FTP.
          common_flags="--config rclone.conf --transfers 2 --checkers 4 --contimeout 10s --timeout 30s --retries 2 --low-level-retries 2 --stats 10s --ignore-existing"

          rclone copy ftp:"${REMOTE_PATH}/maps" _ftp/maps --filter-from _state/filter_maps.txt $common_flags
          rclone copy ftp:"${REMOTE_PATH}/materials" _ftp/materials --filter-from _state/filter_materials.txt $common_flags
          rclone copy ftp:"${REMOTE_PATH}/models" _ftp/models --filter-from _state/filter_models.txt $common_flags
          rclone copy ftp:"${REMOTE_PATH}/sound" _ftp/sound --filter-from _state/filter_sound.txt $common_flags
          rclone copy ftp:"${REMOTE_PATH}/resource/overviews" _ftp/resource/overviews --filter-from _state/filter_overviews.txt $common_flags

      - name: Compress to bz2-only and merge into repo
        run: |
          set -euo pipefail

          mkdir -p _out
          rsync -a _ftp/ _out/

          find _out -type f \( \
            -name "*.bsp" -o -name "*.nav" -o \
            -name "*.vmt" -o -name "*.vtf" -o \
            -name "*.mdl" -o -name "*.vvd" -o -name "*.vtx" -o \
            -name "*.wav" -o -name "*.mp3" -o \
            -path "*/resource/overviews/*.txt" \
          \) -print0 | while IFS= read -r -d '' f; do
            bzip2 -f -k "$f"
            rm -f "$f"
          done

          mkdir -p cstrike
          rsync -a _out/ cstrike/

          # enforce bz2-only
          find cstrike -type f \( \
            -name "*.bsp" -o -name "*.nav" -o \
            -name "*.vmt" -o -name "*.vtf" -o \
            -name "*.mdl" -o -name "*.vvd" -o -name "*.vtx" -o \
            -name "*.wav" -o -name "*.mp3" -o \
            -path "*/resource/overviews/*.txt" \
          \) -delete || true

      - name: Prune repo files deleted on FTP (filtered listing)
        run: |
          set -euo pipefail

          echo "::group::Prune: build remote inventories via rclone lsjson"
          mkdir -p _state/remote _state/repo

          list_remote() {
            local remote_path="$1"
            local out_file="$2"
            local regex="$3"

            rclone lsjson "ftp:${remote_path}" --config rclone.conf --recursive --files-only \
              | python3 -c "import json,sys,re; rx=re.compile(r'$regex'); data=json.load(sys.stdin); [print(e.get('Path','')) for e in data if rx.search(e.get('Path',''))]" \
              | sort -u > "$out_file"

            echo "$(basename "$out_file"): $(wc -l < "$out_file")"
            head -n 10 "$out_file" || true
            echo "---"
          }

          # maps: bsp/nav only (no .res)
          list_remote "${REMOTE_PATH}/maps" _state/remote/maps.txt '\.(bsp|nav)$'

          # materials
          list_remote "${REMOTE_PATH}/materials" _state/remote/materials.txt '\.(vmt|vtf)$'

          # models: no .phy
          list_remote "${REMOTE_PATH}/models" _state/remote/models.txt '\.(mdl|vvd|vtx)$'

          # sound
          list_remote "${REMOTE_PATH}/sound" _state/remote/sound.txt '\.(wav|mp3)$'

          # resource/overviews only
          list_remote "${REMOTE_PATH}/resource/overviews" _state/remote/resource_overviews.txt '\.txt$'

          # Remove stock/test maps from remote map set (bsp only)
          grep -v -F -f _excludes/stock_maps_bsp.txt _state/remote/maps.txt > _state/remote/maps.filtered.txt || true
          mv _state/remote/maps.filtered.txt _state/remote/maps.txt

          echo "::endgroup::"

          echo "::group::Prune: build repo inventories (bz2 minus suffix)"
          : > _state/repo/maps.txt
          : > _state/repo/materials.txt
          : > _state/repo/models.txt
          : > _state/repo/sound.txt
          : > _state/repo/resource_overviews.txt

          if [ -d cstrike ]; then
            find cstrike -type f -name "*.bz2" -print0 | while IFS= read -r -d '' f; do
              rel="${f#cstrike/}"
              case "$rel" in
                maps/*)               echo "${rel#maps/}"               | sed 's/\.bz2$//' >> _state/repo/maps.txt ;;
                materials/*)          echo "${rel#materials/}"          | sed 's/\.bz2$//' >> _state/repo/materials.txt ;;
                models/*)             echo "${rel#models/}"             | sed 's/\.bz2$//' >> _state/repo/models.txt ;;
                sound/*)              echo "${rel#sound/}"              | sed 's/\.bz2$//' >> _state/repo/sound.txt ;;
                resource/overviews/*) echo "${rel#resource/overviews/}" | sed 's/\.bz2$//' >> _state/repo/resource_overviews.txt ;;
              esac
            done
          fi

          for d in maps materials models sound resource_overviews; do
            sort -u -o "_state/repo/${d}.txt" "_state/repo/${d}.txt"
            echo "repo_${d}.txt: $(wc -l < "_state/repo/${d}.txt")"
          done
          echo "::endgroup::"

          echo "::group::Prune: delete stale repo files (repo - remote)"
          delete_stale() {
            local d="$1"
            local repo_list="_state/repo/${d}.txt"
            local remote_list="_state/remote/${d}.txt"
            local prefix="cstrike/${d}"

            # comm needs sorted inputs (we sorted above)
            comm -23 "$repo_list" "$remote_list" | while IFS= read -r f; do
              [ -z "$f" ] && continue
              echo "DEL ${prefix}/${f}.bz2"
              rm -f "${prefix}/${f}.bz2"
            done
          }

          delete_stale maps
          delete_stale materials
          delete_stale models
          delete_stale sound
          delete_stale resource_overviews

          echo "::endgroup::"

          echo "::group::Prune: always remove stock/test maps (bsp only)"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "DEL cstrike/maps/${f}.bz2"
            rm -f "cstrike/maps/${f}.bz2"
          done < _excludes/stock_maps_bsp.txt
          echo "::endgroup::"

      - name: Push Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "FastDL: Sync (rclone ftp, add + prune, overviews-only, bz2-only)"
          branch: main
          file_pattern: "cstrike/** _excludes/** _state/**"
