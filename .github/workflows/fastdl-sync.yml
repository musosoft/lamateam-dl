name: Smart FastDL Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  smart-sync:
    runs-on: ubuntu-latest

    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USERNAME }}
      FTP_PASS: ${{ secrets.FTP_PASSWORD }}
      REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lftp bzip2 rsync

      - name: Build exclude lists from repo + stock map skiplist
        run: |
          set -euo pipefail

          mkdir -p _excludes

          : > _excludes/exclude_maps.txt
          : > _excludes/exclude_materials.txt
          : > _excludes/exclude_models.txt
          : > _excludes/exclude_sound.txt
          : > _excludes/exclude_resource_overviews.txt

          # Stock maps: BSP only (your list)
          cat >> _excludes/exclude_maps.txt <<'EOF'
          test_speakers.bsp
          test_hardware.bsp
          de_train.bsp
          de_tides.bsp
          de_prodigy.bsp
          de_port.bsp
          de_piranesi.bsp
          de_nuke.bsp
          de_inferno.bsp
          de_dust2.bsp
          de_dust.bsp
          de_chateau.bsp
          de_cbble.bsp
          de_aztec.bsp
          cs_office.bsp
          cs_militia.bsp
          cs_italy.bsp
          cs_havana.bsp
          cs_compound.bsp
          cs_assault.bsp
          EOF

          # Exclude already-present repo files (bz2 minus suffix)
          if [ -d cstrike ]; then
            find cstrike -type f -name "*.bz2" -print0 | while IFS= read -r -d '' f; do
              rel="${f#cstrike/}"
              case "$rel" in
                maps/*)
                  echo "${rel#maps/}" | sed 's/\.bz2$//' >> _excludes/exclude_maps.txt
                  ;;
                materials/*)
                  echo "${rel#materials/}" | sed 's/\.bz2$//' >> _excludes/exclude_materials.txt
                  ;;
                models/*)
                  echo "${rel#models/}" | sed 's/\.bz2$//' >> _excludes/exclude_models.txt
                  ;;
                sound/*)
                  echo "${rel#sound/}" | sed 's/\.bz2$//' >> _excludes/exclude_sound.txt
                  ;;
                resource/overviews/*)
                  echo "${rel#resource/overviews/}" | sed 's/\.bz2$//' >> _excludes/exclude_resource_overviews.txt
                  ;;
              esac
            done
          fi

          for f in _excludes/exclude_*.txt; do
            sort -u -o "$f" "$f"
            echo "$(basename "$f"): $(wc -l < "$f")"
          done

      - name: Mirror missing content from FTP (no listing globs, no 550)
        run: |
          set -euo pipefail
          : "${FTP_HOST:?}"
          : "${FTP_USER:?}"
          : "${FTP_PASS:?}"
          : "${REMOTE_PATH:?}"

          rm -rf _ftp _out
          mkdir -p _ftp/maps _ftp/materials _ftp/models _ftp/sound _ftp/resource/overviews

          lftp -c "
            set cmd:fail-exit yes;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;

            open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST';
            cd '$REMOTE_PATH';

            mirror --continue --only-newer --parallel=3 --verbose=1 \
              --include-glob \"*.bsp\" --include-glob \"*.nav\" \
              --exclude-glob-from=_excludes/exclude_maps.txt \
              --exclude-glob \"*\" \
              maps _ftp/maps;

            mirror --continue --only-newer --parallel=3 --verbose=1 \
              --include-glob \"*.vmt\" --include-glob \"*.vtf\" \
              --exclude-glob-from=_excludes/exclude_materials.txt \
              --exclude-glob \"*\" \
              materials _ftp/materials;

            mirror --continue --only-newer --parallel=3 --verbose=1 \
              --include-glob \"*.mdl\" --include-glob \"*.vvd\" --include-glob \"*.vtx\" \
              --exclude-glob-from=_excludes/exclude_models.txt \
              --exclude-glob \"*\" \
              models _ftp/models;

            mirror --continue --only-newer --parallel=3 --verbose=1 \
              --include-glob \"*.wav\" --include-glob \"*.mp3\" \
              --exclude-glob-from=_excludes/exclude_sound.txt \
              --exclude-glob \"*\" \
              sound _ftp/sound;

            mirror --continue --only-newer --parallel=3 --verbose=1 \
              --include-glob \"*.txt\" \
              --exclude-glob-from=_excludes/exclude_resource_overviews.txt \
              --exclude-glob \"*\" \
              resource/overviews _ftp/resource/overviews;

            quit
          "

      - name: Compress to bz2-only and merge into repo
        run: |
          set -euo pipefail

          mkdir -p _out
          rsync -a _ftp/ _out/

          find _out -type f \( \
            -name "*.bsp" -o -name "*.nav" -o \
            -name "*.vmt" -o -name "*.vtf" -o \
            -name "*.mdl" -o -name "*.vvd" -o -name "*.vtx" -o \
            -name "*.wav" -o -name "*.mp3" -o \
            -path "*/resource/overviews/*.txt" \
          \) -print0 | while IFS= read -r -d '' f; do
            bzip2 -f -k "$f"
            rm -f "$f"
          done

          mkdir -p cstrike
          rsync -a _out/ cstrike/

          # enforce bz2-only
          find cstrike -type f \( \
            -name "*.bsp" -o -name "*.nav" -o \
            -name "*.vmt" -o -name "*.vtf" -o \
            -name "*.mdl" -o -name "*.vvd" -o -name "*.vtx" -o \
            -name "*.wav" -o -name "*.mp3" -o \
            -path "*/resource/overviews/*.txt" \
          \) -delete || true

      - name: Sanitize repo (remove stock maps every run)
        run: |
          set -euo pipefail
          if [ -d cstrike/maps ]; then
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              rm -f "cstrike/maps/${f}.bz2"
            done < _excludes/exclude_maps.txt
          fi

      - name: Push Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "FastDL: Sync (repo-excludes + stock-skiplist + overviews-only)"
          branch: main
          file_pattern: "cstrike/** _excludes/**"
