name: Pages

on:
  workflow_run:
    workflows: ["Smart FastDL Sync (rclone)"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cstrike

      - name: Deploy
        uses: actions/deploy-pages@v4
